<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="11" rx="4"></rect>
          <path d="M7 10.5v4"></path>
          <path d="M5 12.5h4"></path>
          <circle cx="15.5" cy="10.5" r="1"></circle>
          <circle cx="18" cy="13" r="1"></circle>
        </svg>
      </span>
      <h2>GamerStore</h2>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/catalogo" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="20" r="1"></circle>
          <circle cx="18" cy="20" r="1"></circle>
          <path d="M2.5 3h2l2.6 12.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"></path>
        </svg>
        Ver catálogo
      </a>
      <a routerLink="/pedidos" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8 12 3 3 8v8l9 5 9-5z"></path>
          <path d="M3 8l9 5 9-5"></path>
          <path d="M12 13v8"></path>
        </svg>
        Mis pedidos
      </a>
      <a routerLink="/notificaciones" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path>
          <path d="M10 20a2 2 0 0 0 4 0"></path>
        </svg>
        Notificaciones
      </a>
      <a routerLink="/perfil" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"></path>
        </svg>
        Mi perfil
      </a>
    </nav>

    <div class="sidebar-footer">
      <p>{{ getUserName() }}</p>
      <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <h1>Bienvenido, {{ getUserName() }}</h1>
    <p class="subtitle">Selecciona una opción del menú para comenzar.</p>
  </main>
</div>
