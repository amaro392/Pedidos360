server.port=8082

# Conexión H2 en memoria (Se reinicia limpia cada vez que ejecutas el proyecto)
spring.datasource.url=jdbc:h2:mem:productosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crea las tablas limpias desde cero en cada reinicio
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Azure AD
azure.ad.jwk-set-uri=https://login.microsoftonline.com/7c165262-9efb-4aae-85ec-c2645f733de3/discovery/v2.0/keys
azure.ad.issuer=https://sts.windows.net/7c165262-9efb-4aae-85ec-c2645f733de3/
azure.ad.audience=api://31a9a52e-4eed-46bf-9dcf-452616e8610a

# Inicialización de SQL
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
