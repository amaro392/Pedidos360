# Arquitectura Kafka para Pedidos360: 1 Zookeeper + 2 brokers.
#
#   cd kafka
#   docker compose -f docker-compose.kafka.yml up -d
#
# Puertos para los microservicios (fuera de Docker):
#   broker 1 -> <KAFKA_HOST>:9092      broker 2 -> <KAFKA_HOST>:9093
# Los microservicios se conectan con:
#   KAFKA_BOOTSTRAP_SERVERS=<KAFKA_HOST>:9092,<KAFKA_HOST>:9093
#
# KAFKA_HOST es la direccion con la que los clientes externos llegan a los brokers:
#   - Local (tu PC):  localhost (valor por defecto)
#   - AWS EC2:        la IP publica/DNS de la EC2 (copiar env.example a .env y editarlo)
#
# Dentro de la red Docker (Kafka UI, otros contenedores) se usa kafka1:29092 y kafka2:29092.
# Esta red se llama pedidos360-kafka-net y la reutiliza docker-compose.kafka-ui.yml.

name: pedidos360-kafka

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    - zookeeper
  networks:
    - kafka-net
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 20s
    timeout: 15s
    retries: 10
    start_period: 40s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 1
  KAFKA_NUM_PARTITIONS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - kafka-net

  kafka1:
    <<: *kafka
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data

networks:
  kafka-net:
    name: pedidos360-kafka-net

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka1-data:
  kafka2-data:
