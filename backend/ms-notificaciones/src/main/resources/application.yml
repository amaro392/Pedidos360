spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
    consumer:
      group-id: notificaciones-clientes
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # Un mensaje con JSON invalido no debe bloquear al consumidor
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: cl.duoc.pedidos360.events.ClienteEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: cl.duoc.pedidos360.events
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

app:
  rabbitmq:
    exchanges:
      pedidos: pedidos.exchange
      dlx: pedidos.dlx
    queues:
      notificaciones: notificaciones.pedido.queue
      notificaciones-dlq: notificaciones.pedido.dlq
      tickets: tickets.pedido.queue
      tickets-dlq: tickets.pedido.dlq
      documentos: documentos.pedido.queue
      documentos-dlq: documentos.pedido.dlq
    routing-keys:
      pedido-creado: pedido.creado
      pedido-cancelado: pedido.cancelado
      pedido-todos: pedido.*
      notificaciones-dead: notificaciones.dead
      tickets-dead: tickets.dead
      documentos-dead: documentos.dead
    dlq-listener-enabled: ${DLQ_LISTENER_ENABLED:false}
  kafka:
    topics:
      clientes-registro: clientes.registro

